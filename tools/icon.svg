<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141b33"/>
      <stop offset="55%" stop-color="#0a0f22"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="45%" stop-color="#f59e4c"/>
      <stop offset="80%" stop-color="#9c4a1e"/>
      <stop offset="100%" stop-color="#3d1d10"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#e8ecf5"/>
      <stop offset="70%" stop-color="#8b93a8"/>
      <stop offset="100%" stop-color="#3a4054"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57d9ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3d7dff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#57d9ff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb45e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb45e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frontHalf"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <clipPath id="backHalf"><rect x="0" y="0" width="1024" height="512"/></clipPath>
  </defs>

  <!-- deep-space background -->
  <rect width="1024" height="1024" fill="url(#space)"/>

  <!-- starfield -->
  <g fill="#dfe8ff">
    <circle cx="92"   cy="128" r="3.4" opacity="0.9"/><circle cx="188" cy="64"  r="2.2" opacity="0.7"/>
    <circle cx="320"  cy="150" r="1.8" opacity="0.6"/><circle cx="462" cy="90"  r="2.8" opacity="0.85"/>
    <circle cx="610"  cy="132" r="2.0" opacity="0.65"/><circle cx="742" cy="70"  r="3.0" opacity="0.9"/>
    <circle cx="884"  cy="148" r="2.4" opacity="0.8"/><circle cx="958" cy="300" r="1.9" opacity="0.6"/>
    <circle cx="1010" cy="470" r="2.6" opacity="0.85"/><circle cx="60"   cy="330" r="2.2" opacity="0.7"/>
    <circle cx="44"   cy="560" r="3.0" opacity="0.9"/><circle cx="126"  cy="700" r="1.8" opacity="0.55"/>
    <circle cx="80"   cy="868" r="2.6" opacity="0.8"/><circle cx="250"  cy="950" r="2.0" opacity="0.65"/>
    <circle cx="430"  cy="976" r="2.8" opacity="0.85"/><circle cx="620"  cy="940" r="1.9" opacity="0.6"/>
    <circle cx="800"  cy="912" r="3.2" opacity="0.9"/><circle cx="940"  cy="820" r="2.2" opacity="0.7"/>
    <circle cx="972"  cy="640" r="1.8" opacity="0.55"/><circle cx="380"  cy="246" r="1.6" opacity="0.5"/>
    <circle cx="700"  cy="220" r="1.5" opacity="0.45"/><circle cx="500"  cy="196" r="1.3" opacity="0.4"/>
    <circle cx="150"  cy="440" r="1.4" opacity="0.45"/><circle cx="906"  cy="500" r="1.3" opacity="0.4"/>
    <circle cx="226"  cy="196" r="1.2" opacity="0.4"/><circle cx="840"  cy="248" r="1.4" opacity="0.5"/>
  </g>

  <!-- orbit ring: back half (drawn BEHIND the planet) -->
  <g clip-path="url(#backHalf)">
    <ellipse cx="512" cy="512" rx="430" ry="150" transform="rotate(-18 512 512)"
             fill="none" stroke="url(#orbit)" stroke-width="7" opacity="0.95"/>
    <circle cx="947" cy="352" r="20" fill="#9bd7ff"/>
  </g>

  <!-- back half of the planet ring (behind) -->
  <g clip-path="url(#backHalf)">
    <ellipse cx="512" cy="548" rx="330" ry="96" transform="rotate(-14 512 548)"
             fill="none" stroke="#e8c79a" stroke-width="46" opacity="0.85"/>
    <ellipse cx="512" cy="548" rx="330" ry="96" transform="rotate(-14 512 548)"
             fill="none" stroke="#7a5a34" stroke-width="14" opacity="0.5"/>
  </g>

  <!-- planet glow + body -->
  <circle cx="512" cy="530" r="320" fill="url(#glow)"/>
  <circle cx="512" cy="530" r="218" fill="url(#planet)"/>
  <g opacity="0.22" fill="#5a2410">
    <ellipse cx="512" cy="472" rx="196" ry="26"/>
    <ellipse cx="512" cy="548" rx="210" ry="18"/>
    <ellipse cx="512" cy="612" rx="188" ry="24"/>
  </g>
  <!-- atmosphere rim light -->
  <circle cx="512" cy="530" r="218" fill="none" stroke="#ffd9a0" stroke-width="4" opacity="0.5"/>

  <!-- orbit ring: front half (drawn IN FRONT) -->
  <g clip-path="url(#frontHalf)">
    <ellipse cx="512" cy="512" rx="430" ry="150" transform="rotate(-18 512 512)"
             fill="none" stroke="url(#orbit)" stroke-width="7" opacity="0.95"/>
    <circle cx="116" cy="398" r="13" fill="#7fe7c4"/>
  </g>

  <!-- moon -->
  <circle cx="812" cy="252" r="58" fill="url(#moon)"/>
  <circle cx="790" cy="234" r="9" fill="#6a7185" opacity="0.6"/>
  <circle cx="836" cy="276" r="6" fill="#6a7185" opacity="0.5"/>
  <circle cx="818" cy="300" r="4" fill="#6a7185" opacity="0.45"/>
</svg>
