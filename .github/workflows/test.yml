name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Deterministic Node suites (no browser): state facade, time/Kepler/
  # integrator policy, and the celestial identity contract.
  unit:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Headless browser boot of the real dev server (source modules + local
  # three): asserts population counts, NaN-free physics, a live canvas and a
  # full pilot-mode round trip.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot dev server
        run: node server.js > server.log 2>&1 &
      - name: Run CI smoke
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/ > /dev/null && break
            sleep 1
          done
          node tools/ci-smoke.mjs
