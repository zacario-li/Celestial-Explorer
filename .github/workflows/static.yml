name: Deploy static content to Pages

# Deploys the app to GitHub Pages as a self-contained site: repo assets +
# vendored three (from npm) + the esbuild dist/ build -- no CDN, and
# node_modules is never committed.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build dist/
        run: npm run build
      - name: Stage Pages root (repo + vendored three + dist)
        run: |
          mkdir -p pages/node_modules
          cp -r node_modules/three pages/node_modules/
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude '.github' \
                   --exclude 'tests' --exclude 'tools' --exclude 'scratch.js' \
                   --exclude 'pages' ./ pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'
      - id: deployment
        uses: actions/deploy-pages@v4
