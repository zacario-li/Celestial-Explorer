name: Deploy static content to Pages

# Deploys the app to GitHub Pages as a self-contained site: repo assets +
# vendored three (from npm) + the esbuild dist/ build -- no CDN, and
# node_modules is never committed.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build dist/
        run: npm run build
      - name: Stage Pages root
        run: |
          mkdir -p pages/dist
          cp dist/app.js pages/dist/
          cp dist/index.html pages/index.html
          cp style.css pages/
          cp -r textures pages/
          cp -r assets pages/
          touch pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'
      - id: deployment
        uses: actions/deploy-pages@v4
